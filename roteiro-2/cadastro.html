<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProgWeb 2 — Roteiro 02 | jQuery &amp; LocalStorage</title>

  <!-- Bootstrap 5 CSS e Bootstrap Icons (mesmos da Parte 1) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">

  <header class="bg-dark text-white py-3 mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h4 mb-0"><i class="bi bi-people"></i> Cadastro de Clientes</h1>
      <button type="button" id="btn-toggle-ajuda" class="btn btn-outline-light btn-sm">
        <i class="bi bi-question-circle"></i> Ajuda
      </button>
    </div>
  </header>

  <main class="container">

    <!-- Exemplo 9: painel retrátil (começa oculto) -->
    <div id="painel-ajuda" class="alert alert-secondary" style="display: none;">
      <strong>Como usar:</strong> preencha nome e e-mail e clique em <em>Salvar Cliente</em>.
      Os dados ficam salvos no navegador (LocalStorage) e continuam na tela após recarregar a página (F5).
      Use o campo de busca para filtrar a tabela por nome.
    </div>

    <div class="row g-4">

      <!-- Coluna de cadastro (col-md-4) -->
      <div class="col-12 col-md-4">

        <!-- Formulário de Cadastro (#form-cadastro) -->
        <form id="form-cadastro" class="card p-3 mb-3" novalidate>
          <input type="text" id="input-nome"
                 class="form-control mb-2" placeholder="Nome">
          <input type="email" id="input-email"
                 class="form-control mb-2" placeholder="E-mail">
          <button type="submit" id="btn-salvar"
                  class="btn btn-primary">Salvar Cliente</button>
        </form>

        <!-- Caixa de Alerta para Feedback Visual (#caixa-mensagem) -->
        <div id="caixa-mensagem"
             class="alert alert-info d-none"></div>
      </div>

      <!-- Coluna da tabela (col-md-8) -->
      <div class="col-12 col-md-8">

        <!-- Desafio extra: filtro em tempo real -->
        <div class="input-group mb-3">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="text" id="filtro-nome" class="form-control"
                 placeholder="Buscar por nome...">
        </div>

        <!-- Tabela com Corpo Dinâmico (#tabela-corpo) -->
        <div class="card shadow-sm">
          <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>E-mail</th>
                  <th>Ação</th>
                </tr>
              </thead>
              <tbody id="tabela-corpo"></tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Scripts no final do body: jQuery, Bootstrap JS e a lógica em app.js -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
